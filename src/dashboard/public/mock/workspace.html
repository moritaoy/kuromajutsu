<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kuromajutsu — Workspace (Mock)</title>
<style>
:root {
  --bg-primary:#0d1117; --bg-secondary:#161b22; --bg-card:#1c2128; --bg-hover:#222a33;
  --text-primary:#e6edf3; --text-secondary:#8b949e; --text-muted:#6e7681;
  --purple:#a371f7; --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922;
  --border:#30363d; --border-hover:#484f58;
  --gradient:linear-gradient(135deg,var(--purple),var(--blue));
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.5;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text-primary);background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
textarea{resize:vertical}

.header{background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30}
.brand{font-weight:700;font-size:18px;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{font-size:11px;padding:1px 8px;border-radius:10px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary)}
.badge.mock{color:var(--yellow);border-color:var(--yellow)}
.spacer{flex:1}
.stepper{display:flex;gap:0;margin-left:24px}
.stp{display:flex;align-items:center;gap:8px;padding:4px 14px;color:var(--text-muted);font-size:13px;position:relative}
.stp+.stp::before{content:"";position:absolute;left:-6px;top:50%;width:12px;height:1px;background:var(--border)}
.stp .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);display:grid;place-items:center;font-size:12px}
.stp.active{color:var(--text-primary)}
.stp.active .n{background:var(--gradient);border-color:transparent;color:#fff}
.stp.done{color:var(--text-secondary)}
.stp.done .n{border-color:var(--green);color:var(--green)}

.page{padding:20px 24px 170px;max-width:1700px;margin:0 auto}
.title{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{color:var(--text-secondary);margin-bottom:16px}
.card-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px}
.btn{border:1px solid var(--border);background:var(--bg-card);padding:7px 14px;border-radius:6px;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--border-hover);background:var(--bg-hover)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--gradient);border-color:transparent;color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);background:var(--gradient)}
.btn.danger{color:var(--red);border-color:rgba(248,81,73,.5)}
.btn.sm{padding:3px 9px;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--text-secondary);background:var(--bg-secondary);cursor:pointer}
.chip:hover{border-color:var(--border-hover);color:var(--text-primary)}
label.f{display:block;font-size:12px;color:var(--text-secondary);margin:12px 0 4px}

/* 指示画面（機械的・最小） */
.instruct{max-width:860px;margin:18vh auto 0;font-family:var(--mono)}
.prompt{display:flex;gap:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);padding:14px 16px}
.prompt:focus-within{border-color:var(--purple)}
.caret{color:var(--purple);font-weight:700}
.prompt textarea{border:0;background:transparent;padding:0;min-height:130px;font-family:var(--mono);font-size:15px;line-height:1.7;resize:vertical}
.prompt textarea:focus{outline:none}
.ibar{display:flex;align-items:center;gap:16px;margin-top:10px;font-size:12px;color:var(--text-muted)}
.ibar label{display:flex;align-items:center;gap:8px}
.ibar input{width:280px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;padding:3px 2px;font-family:var(--mono);font-size:12px}
.ibar input:focus{border-color:var(--purple)}
.ex{display:flex;gap:8px;align-items:center}.ex a{cursor:pointer;color:var(--text-secondary);border:1px solid var(--border);border-radius:4px;padding:0 6px}.ex a:hover{color:var(--text-primary);border-color:var(--border-hover)}
.send{border:1px solid var(--purple);background:transparent;color:var(--purple);border-radius:6px;padding:5px 14px;font-family:var(--mono);font-size:12px}
.send:hover:not(:disabled){background:var(--purple);color:#fff}.send:disabled{opacity:.3;cursor:not-allowed}

/* 計画生成中 */
.planning{max-width:860px;margin:18vh auto 0;font-family:var(--mono)}
.echo{display:flex;gap:12px;color:var(--text-secondary);font-size:14px;line-height:1.7;border-left:2px solid var(--border);padding-left:14px;margin-bottom:22px}
.planning ul{list-style:none}
.planning li{padding:3px 0;color:var(--text-muted);display:flex;gap:12px;font-size:13px;align-items:center}
.planning li .mk{width:14px;text-align:center}
.planning li.on{color:var(--text-primary)}.planning li.ok{color:var(--text-secondary)}.planning li.ok .mk{color:var(--green)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:sp .8s linear infinite;margin:0 1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 2 カラム */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.aside .sec{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.aside h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-weight:600}
.vrow{display:flex;gap:8px;font-size:12.5px;padding:3px 0;align-items:flex-start}
.vi{width:16px;flex:none;text-align:center}
.vi.ok{color:var(--green)}.vi.error{color:var(--red)}.vi.warn{color:var(--yellow)}
.hint{font-size:12px;color:var(--text-muted)}

@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}.board-wrap{max-height:none}.drawer{width:min(430px,100vw)}.stepper{display:none}}

/* ---- 計画レビュー ---- */
.review{font-family:var(--mono)}
.rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.rhead h2{font-size:17px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.rhead .rev{font-size:11px;color:var(--purple);border:1px solid var(--purple);border-radius:3px;padding:0 6px}
.rhead .goal{font-size:12.5px;color:var(--text-secondary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.rhead .sum{flex-basis:100%;font-size:11px;color:var(--text-muted);letter-spacing:.03em;display:flex;gap:0 14px;flex-wrap:wrap}
.rhead .sum b{color:var(--text-secondary);font-weight:600}
.review .aside{position:sticky;top:58px;max-height:calc(100vh - 58px - 150px);overflow:auto;scrollbar-width:thin}
.review .board-wrap{max-height:none}
.kv2{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;font-size:12px}
.kv2 dt{color:var(--text-muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv2 dd{color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif;font-size:12.5px}
.kv2 dd.mono{font-family:var(--mono);font-size:12px}
.kv2 ul{list-style:none}.kv2 li{padding:1px 0;display:flex;gap:6px}.kv2 li::before{content:"·";color:var(--text-muted);flex:none}
.kv2 li.asm{cursor:pointer;border-radius:3px;margin:0 -4px;padding:1px 4px}
.kv2 li.asm::before{content:"?";color:var(--yellow);font-weight:700;font-family:var(--mono)}
.kv2 li.asm:hover{background:rgba(210,153,34,.12)}
.kv2 li.asm:hover::after{content:"→ 指示";margin-left:auto;color:var(--yellow);font-family:var(--mono);font-size:11px;flex:none}
.kv2 .asmh{color:var(--yellow);font-size:11px}
.sec.val summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:12px}
.sec.val summary::-webkit-details-marker{display:none}
.sec.val summary .st{font-weight:600}.sec.val summary .st.ok{color:var(--green)}.sec.val summary .st.error{color:var(--red)}.sec.val summary .st.warn{color:var(--yellow)}
.sec.val summary .tw{margin-left:auto;color:var(--text-muted);font-size:11px}
.sec.val[open] summary .tw{transform:rotate(90deg)}
.sec.val .rows{margin-top:8px;border-top:1px solid var(--border);padding-top:6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.sec.val .vrow .vi{font-family:var(--mono)}
.sec.val .fixrow{margin-top:8px;display:flex;gap:8px;align-items:center;font-family:var(--mono)}
.hist .you{display:flex;gap:8px;font-size:12px;color:var(--text-secondary);margin:4px 0;word-break:break-word}
.hist .you .caret{flex:none}
.hist .you .tg{color:var(--blue);flex:none}
.hist .pl{border-left:2px solid var(--purple);padding:2px 0 2px 10px;margin:4px 0 8px}
.hist .pl .rv{font-size:10.5px;color:var(--purple);letter-spacing:.08em;margin-bottom:2px}
.hist .pl li{list-style:none;font-size:12px;color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif;padding:1px 0}
.hist .pl li::before{content:"+ ";font-family:var(--mono);color:var(--purple)}
.hist details{margin-top:4px}.hist details summary{cursor:pointer;font-size:11px;color:var(--text-muted);list-style:none}
.hist details summary::-webkit-details-marker{display:none}
.hist details .pl{border-color:var(--border)}.hist details .pl .rv{color:var(--text-muted)}.hist details .pl li{color:var(--text-secondary)}.hist details .pl li::before{color:var(--text-muted)}
/* 選択中のステップ詳細 */
.sel-sec .sh{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.sel-sec .sh .id{color:var(--text-muted)}
.sel-sec .sh .kd{font-size:10px;letter-spacing:.1em;color:var(--text-muted)}
.sel-sec .sh .kd.gate{color:var(--yellow)}
.sel-sec .sh .x{margin-left:auto;cursor:pointer;color:var(--text-muted);border:0;background:none;font-family:var(--mono)}
.sel-sec .sh .x:hover{color:var(--text-primary)}
.sel-sec .st{font-size:13.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif;margin-bottom:6px}
.sel-sec .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-muted);margin-bottom:8px}
.sel-sec .lanec{border-left:2px solid var(--lc);padding-left:6px}
.sel-sec .chk li{align-items:baseline}
.sel-sec .m{font-size:10px;border:1px solid var(--border);border-radius:3px;padding:0 4px;color:var(--text-muted);font-family:var(--mono);flex:none}
.sel-sec .m.manual{color:var(--yellow);border-color:rgba(210,153,34,.5)}.sel-sec .m.command{color:var(--blue);border-color:rgba(88,166,255,.5)}
.sel-sec .cmd{display:block;font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.sel-sec .deps{display:flex;gap:4px;flex-wrap:wrap}
.sel-sec .dep{font-family:var(--mono);font-size:11px;border:1px solid var(--border);border-radius:3px;padding:0 6px;cursor:pointer;color:var(--text-secondary)}
.sel-sec .dep:hover{border-color:var(--border-hover);color:var(--text-primary)}
.sel-sec .dep.gate{border-color:rgba(210,153,34,.5)}
.sel-sec .act{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sel-sec .tbtn{align-self:flex-start;border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:4px;padding:3px 10px;font-family:var(--mono);font-size:12px}
.sel-sec .tbtn.on{background:var(--blue);color:#fff}
.sel-sec .tbtn:hover{filter:brightness(1.15)}
.sel-empty{font-size:11.5px;color:var(--text-muted);padding:8px 12px;border:1px dashed var(--border);border-radius:6px;margin-bottom:10px}
.qs{display:flex;gap:5px;flex-wrap:wrap}
.q{font-family:var(--mono);font-size:11px;color:var(--text-secondary);border:1px solid var(--border);border-radius:3px;padding:1px 7px;cursor:pointer;background:transparent;white-space:nowrap}
.q:hover{color:var(--text-primary);border-color:var(--border-hover)}

/* ボード */
.board-box{background:var(--bg-card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.board-head{display:flex;align-items:center;gap:6px 10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.board-head h3{font-size:15px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-muted);margin-left:auto;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.board-wrap{overflow:auto;padding:14px 16px 18px;max-height:calc(100vh - 230px);scrollbar-width:thin}
.bfoot{display:flex;gap:14px;flex-wrap:wrap;padding:6px 16px 8px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10.5px;color:var(--text-muted);letter-spacing:.03em}
.bfoot i{display:inline-block;width:14px;height:0;border-top:2px solid var(--bc);vertical-align:3px;margin-right:4px}
.board{position:relative;display:grid;min-width:max-content;font-family:var(--mono)}
.board.bd-v{column-gap:34px;row-gap:0}
.board.bd-h{row-gap:0;column-gap:0}
.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.board path.edge{fill:none;stroke:#4d555e;stroke-width:1.3;marker-end:url(#ar-g);transition:opacity .15s}
.board path.edge.done{stroke:#3fb950;marker-end:url(#ar-ok)}
.board path.edge.act{stroke:#58a6ff;marker-end:url(#ar-b)}
.board path.edge.cyc{stroke:var(--red);stroke-dasharray:4 3}
.board.focus path.edge:not(.lit){opacity:.12}
.board.focus path.edge.lit.up{stroke:var(--blue);stroke-width:1.6;marker-end:url(#ar-b)}
.board.focus path.edge.lit.down{stroke:var(--purple);stroke-width:1.6;marker-end:url(#ar-p)}
.board.focus .card:not(.lit){opacity:.32}
.board.focus .card.lit{opacity:1}
.board .corner{font-size:9px;color:var(--text-muted);letter-spacing:.12em;align-self:end;padding-bottom:6px;z-index:2}
.lh{z-index:2;position:relative;padding:0 0 10px}
.bd-v .lh{border-top:2px solid var(--lc);padding-top:6px;max-width:196px}
.bd-h .lh{border-left:2px solid var(--lc);padding:8px 10px 8px 8px;align-self:center}
.lh .nm{font-size:12.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif;display:flex;gap:6px;align-items:baseline}
.lh .nm .lid{font-family:var(--mono);font-size:10px;color:var(--lc);font-weight:600;letter-spacing:.06em}
.lh .rl{display:flex;flex-wrap:wrap;gap:3px 6px;margin-top:4px}
.lg{font-size:10px;color:var(--text-muted);z-index:2;letter-spacing:.06em}
.bd-v .lg{padding-top:12px;text-align:left}
.bd-h .lg{padding:0 0 6px;text-align:left;align-self:end}
.lg.final{color:var(--yellow)}
.lane-bg{z-index:0;background:rgba(255,255,255,.012)}
.bd-v .lane-bg{border-top:1px solid var(--border)}
.bd-h .lane-bg{border-left:1px solid var(--border)}
.lane-bg.final{background:rgba(210,153,34,.05);border-top:1px dashed rgba(210,153,34,.4)!important;border-left:1px dashed rgba(210,153,34,.4)!important}
.cell{display:flex;gap:10px;z-index:2;position:relative;align-items:flex-start}
.bd-v .cell{flex-direction:row;padding:12px 0 30px}
.bd-h .cell{flex-direction:column;padding:10px 46px 10px 0}
.bd-v .cell.final{justify-content:center;padding-bottom:12px}
.bd-h .cell.final{justify-content:center;padding-right:0;padding-left:0}
.bd-v .cell.final .card{width:360px}
.bd-h .cell.final .card{width:220px}
.card{background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;padding:6px 9px 7px;cursor:pointer;position:relative;transition:border-color .15s, box-shadow .15s, opacity .15s;width:196px;flex:none}
.bd-h .card{width:206px}
.card:hover{border-color:var(--border-hover)}
.card.sel{border-color:var(--text-secondary);box-shadow:inset 2px 0 0 var(--blue)}
.card.target{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.card .top{display:flex;gap:6px;align-items:center;font-size:10px;color:var(--text-muted);letter-spacing:.06em}
.card .top .id{color:var(--text-secondary);font-weight:600}
.card .top .k{font-weight:600}
.card .top .tg{margin-left:auto;color:var(--text-muted);font-size:11px}
.card.target .top .tg{color:var(--blue)}
.card .ttl{font-size:12.5px;font-weight:500;margin:3px 0 5px;line-height:1.35;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.card .bot{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:10.5px;color:var(--text-muted)}
.card.gate{border-color:rgba(210,153,34,.6);border-style:double;border-width:3px;padding:5px 8px 6px;background:linear-gradient(180deg,rgba(210,153,34,.07),var(--bg-secondary))}
.card.gate .top .k{color:var(--yellow)}
.card.final{border-color:var(--yellow);background:linear-gradient(180deg,rgba(210,153,34,.14),var(--bg-secondary))}
.card.gate.target{box-shadow:0 0 0 1px var(--blue);border-color:var(--blue)}
.tag{font-size:9.5px;padding:0 5px;border-radius:3px;font-weight:600;letter-spacing:.04em}
.tag.added{background:rgba(63,185,80,.18);color:var(--green)}
.tag.modified{background:rgba(88,166,255,.18);color:var(--blue)}
.tag.replanned{background:rgba(163,113,247,.2);color:var(--purple)}
.tag.irregular{background:rgba(248,81,73,.18);color:var(--red)}
.role{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);font-family:var(--mono)}
.role i{width:7px;height:7px;border-radius:50%;background:var(--rc)}
.role .mdl{font-size:9.5px;color:var(--text-muted);opacity:.8;font-family:var(--mono)}
.role{white-space:nowrap}.card .role .mdl{max-width:92px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:bottom}
.pill{margin-left:auto;font-size:9.5px;padding:0 6px;border-radius:3px;border:1px solid var(--border);letter-spacing:0}
.card.running{border-color:var(--blue)}
.card.running .pill{color:var(--blue);border-color:var(--blue)}
.card.done{border-color:rgba(63,185,80,.6)}
.card.done .pill{color:var(--green);border-color:var(--green)}
.card.rework{border-color:var(--red)}
.card.rework .pill{color:var(--red);border-color:var(--red)}
.card.pending .pill{color:var(--text-muted)}
.prog{height:3px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.prog>div{height:100%;background:var(--blue)}
.card.gate .prog>div{background:var(--yellow)}
.retry{color:var(--red)}

/* 実行 */
.runbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
.rb-title{font-family:inherit;font-weight:600;font-size:13px}
.badge.live{color:var(--blue);border-color:var(--blue)}
.rb-stat{display:flex;align-items:baseline;gap:4px;color:var(--text-primary)}
.rb-stat small{color:var(--text-muted);font-size:10px;margin-right:10px;letter-spacing:.05em}
.meter{flex:1;min-width:160px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.meter>div{height:100%;background:var(--gradient);transition:width .3s}
.runlayout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
.rail{position:sticky;top:60px;display:flex;flex-direction:column;gap:10px}
.orch{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:8px;padding:10px 12px}
.orch-h{display:flex;gap:10px;align-items:center;font-size:12px}
.orch-now{font-family:var(--mono);font-size:12px;margin-top:6px;color:var(--text-primary)}
.orch-run{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rail-box{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 6px}
.tab{padding:7px 11px;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;font-size:12px;font-family:var(--mono)}
.tab.active{color:var(--text-primary);border-color:var(--purple)}
.rail-pane{padding:10px 12px;max-height:calc(100vh - 330px);min-height:240px;overflow:auto}
.muted{color:var(--text-muted)}
.led{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--bg-secondary)}
.led h5{font-size:11px;font-family:var(--mono);color:var(--text-secondary);margin-bottom:4px;display:flex;justify-content:space-between}
.jd{display:grid;grid-template-columns:44px 34px 1fr;gap:6px;font-size:12px;padding:1px 0}
.jd .jl{color:var(--text-muted)}
.jd .a{font-weight:700;font-family:var(--mono);font-size:11px}.a.t{color:var(--green)}.a.f{color:var(--text-muted)}.a.w{color:var(--yellow)}
.log{font-family:var(--mono);font-size:11.5px}
.log>div{padding:3px 4px;border-bottom:1px solid rgba(48,54,61,.5);display:grid;grid-template-columns:40px 70px 1fr;gap:6px;cursor:default}
.log>div[onclick],.log>div:hover{background:var(--bg-hover)}
.log .t{color:var(--text-muted)}
.log .k{font-weight:700}
.log .hl-irr{background:rgba(248,81,73,.1)}.log .hl-rep{background:rgba(163,113,247,.08)}
.k.replan{color:var(--purple)}.k.irregular{color:var(--red)}.k.dispatch{color:var(--blue)}.k.report{color:var(--green)}.k.gp{color:var(--green)}.k.gf{color:var(--red)}.k.info{color:var(--text-secondary)}
.dodg{margin-bottom:8px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;cursor:pointer}
.dodg.irr{border-color:rgba(248,81,73,.6)}
.dodg .gh{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.dodg .gh>span:last-child{color:var(--text-muted);font-weight:400;font-family:var(--mono);font-size:11px;flex:none}
.ci{display:flex;gap:7px;font-size:12px;color:var(--text-secondary);padding:1px 0}
.ci .vi{width:14px}.ci.pass{color:var(--text-primary)}
.demo{border:1px dashed var(--border);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--text-muted);font-family:var(--mono)}
.demo summary{cursor:pointer}
.demo label{display:flex;gap:8px;align-items:center;margin-top:5px}
.demo input[type=checkbox]{width:auto}
.irr-banner{position:sticky;top:52px;z-index:35;margin:-6px 0 12px;display:flex;flex-direction:column;gap:6px}
.irr-item{background:#2a1416;border:1px solid var(--red);border-radius:8px;padding:8px 12px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.irr-head{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap}
.irr-head b{color:var(--red);font-family:var(--mono);letter-spacing:.05em}
.irr-head .tt{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.irr-reason{font-size:12px;color:var(--text-secondary);margin-top:4px}
@media (max-width:1100px){.runlayout{grid-template-columns:minmax(0,1fr)}.rail{position:static}}

/* 完了 */
.done-hero{text-align:center;margin:20px 0 24px}
.done-hero .big{font-size:42px}
.sumgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.sumgrid .card-box{text-align:center}.sumgrid b{font-size:24px;display:block}

/* 完了レポート */
.report{max-width:1080px;margin:0 auto}
.report h3{font-size:15px;margin:28px 0 10px;display:flex;align-items:baseline;gap:10px}
.report h3 small{color:var(--text-muted);font-weight:400;font-size:12px}
.hero{display:flex;gap:16px;align-items:center;margin:6px 0 18px}
.hero .ok{width:44px;height:44px;border-radius:50%;background:rgba(63,185,80,.15);color:var(--green);display:grid;place-items:center;font-size:22px;flex:none}
.hero h2{font-size:20px}.hero p{color:var(--text-secondary);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.kpi{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--text-muted)}
.kpi.warn{border-color:rgba(248,81,73,.6)}.kpi.warn b{color:var(--red)}
.irr-box{border:1px solid rgba(248,81,73,.6);background:rgba(248,81,73,.07);border-radius:8px;padding:12px 14px;margin-top:14px}
.irr-box h4{color:var(--red);font-size:13px;margin-bottom:6px}
.diff{font-family:var(--mono);font-size:12px;margin:6px 0}
.diff div{padding:1px 8px;border-radius:3px}.diff .del{background:rgba(248,81,73,.15);color:#ffa198}.diff .keep{color:var(--text-muted)}.diff .add{background:rgba(63,185,80,.15);color:#7ee787}
.lane-sum{background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--lc);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.lane-sum h4{font-size:14px;display:flex;gap:10px;align-items:center}
.res{padding:8px 0;border-top:1px solid var(--border);margin-top:8px}
.res:first-of-type{border-top:0}
.res .rt{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:500}
.res .rs{font-size:12.5px;color:var(--text-secondary);margin:3px 0 0 0}
.files{font-family:var(--mono);font-size:11.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 14px}
.files .a{color:var(--green)}.files .d{color:var(--red)}
.gantt{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow:auto}
.grow{display:grid;grid-template-columns:230px 1fr;align-items:center;height:24px;font-size:12px}
.grow .gl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary);padding-right:10px}
.grow .gl.lane{color:var(--text-primary);font-weight:600;margin-top:6px}
.gtrack{position:relative;height:16px;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(48,54,61,.6) calc(10% - 1px) 10%)}
.gbar{position:absolute;top:2px;height:12px;border-radius:3px;background:var(--bc);opacity:.85;min-width:3px}
.gbar.gate{background:var(--yellow)}.gbar.rework{background:var(--red)}
.gmark{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--mc)}
.timeline{border-left:2px solid var(--border);margin:8px 0 0 8px;padding-left:16px}
.tl{position:relative;padding:4px 0;font-size:13px}
.tl::before{content:"";position:absolute;left:-23px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--tc,var(--border-hover));border:2px solid var(--bg-primary)}
.tl .tt{font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-right:8px}
.gres{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.gres .g{background:var(--bg-card);border:1px solid rgba(210,153,34,.5);border-radius:8px;padding:10px 12px}
.gres .g h4{font-size:13px;display:flex;justify-content:space-between}

/* ドロワー（実行・完了画面の読み取り専用詳細） */
.drawer{position:fixed;top:0;right:0;bottom:0;width:430px;background:var(--bg-secondary);border-left:1px solid var(--border);z-index:50;display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.4);font-family:var(--mono)}
.drawer header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12px}
.drawer .body{padding:14px 16px;overflow:auto;flex:1}
.drawer .live{margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px}
.drawer .live .fail{color:var(--red);margin-top:4px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}

/* 下部バー（AI への指示） */
.actionbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg-secondary);border-top:1px solid var(--border);padding:8px 24px 10px;z-index:40;font-family:var(--mono)}
.actionbar .in{max-width:1700px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:end}
.actionbar .tgt{grid-column:1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);min-height:20px}
.actionbar .tgt .caret{color:var(--blue)}
.tchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--blue);color:var(--blue);border-radius:3px;padding:0 4px 0 6px;font-size:11px;background:rgba(88,166,255,.08);max-width:260px}
.tchip .nm{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.tchip b{cursor:pointer;font-weight:400;padding:0 2px}.tchip b:hover{color:var(--text-primary)}
.actionbar .clr{cursor:pointer;color:var(--text-muted);text-decoration:underline dotted}.actionbar .clr:hover{color:var(--text-primary)}
.actionbar .prompt{grid-column:1;padding:8px 12px;gap:10px;align-items:flex-start}
.actionbar .prompt textarea{min-height:40px;height:40px;font-size:13px;line-height:1.55;max-height:160px}
.actionbar .qs{grid-column:1}
.actionbar .btns{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.actionbar .send{padding:7px 14px;text-align:center}
.approve{border:1px solid var(--purple);background:var(--purple);color:#fff;border-radius:6px;padding:7px 14px;font-family:var(--mono);font-size:12px;font-weight:600;text-align:center}
.approve:hover:not(:disabled){filter:brightness(1.12)}
.approve:disabled{background:transparent;color:var(--text-muted);border-color:var(--border);cursor:not-allowed}
.approve.err{color:var(--red);border-color:rgba(248,81,73,.5)}
.actionbar .vst{font-size:10.5px;color:var(--text-muted);text-align:center;letter-spacing:.04em}
.actionbar .vst.ok{color:var(--green)}.actionbar .vst.error{color:var(--red)}
@media (max-width:700px){.actionbar .in{grid-template-columns:minmax(0,1fr)}.actionbar .btns{grid-column:1;grid-row:auto;flex-direction:row;align-items:center}.actionbar .btns>*{flex:1}.actionbar .qs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.page{padding-bottom:200px}}
.overlay{position:fixed;inset:0;background:rgba(13,17,23,.6);z-index:60;display:grid;place-items:center}
.empty{color:var(--text-muted);font-size:13px}

/* フェーズ帯ボード */
.board.bd-p{display:flex;flex-direction:column;gap:30px;padding:2px 4px 6px 30px;min-width:max-content}
.pband{position:relative;border:1px solid var(--border);border-left:3px solid var(--lc);border-radius:6px;background:rgba(255,255,255,.012)}
.pband.deferred{border-style:dashed;border-left-style:solid}
.pband.final{border-color:rgba(210,153,34,.45);border-left-color:var(--yellow)}
.pband.target{box-shadow:0 0 0 1px var(--blue);border-color:var(--blue)}
.pband.done{background:rgba(63,185,80,.03)}
.pband.waiting{box-shadow:0 0 0 1px var(--blue)}
.ph{display:flex;gap:6px 10px;align-items:baseline;flex-wrap:wrap;padding:7px 12px 6px;border-bottom:1px solid var(--border);background:var(--bg-card);position:relative;z-index:2;border-radius:5px 5px 0 0}
.review .ph{cursor:pointer}.review .ph:hover{background:var(--bg-hover)}
.pidx{font-size:10px;letter-spacing:.14em;color:var(--lc);font-weight:700}
.pnm{font-size:13.5px;font-weight:600;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.pmode{font-size:10.5px;border:1px solid var(--border);border-radius:3px;padding:0 6px;color:var(--text-secondary)}
.pmode.deferred{color:var(--purple);border-color:rgba(163,113,247,.55);border-style:dashed}
.phuman{font-size:10.5px;color:var(--blue)}
.psp{flex:1}
.pst{font-size:11px;color:var(--text-muted)}.pst.done{color:var(--green)}.pst.active{color:var(--blue)}.pst.waiting{color:var(--blue);font-weight:700}
.ph .tg{color:var(--text-muted);font-size:11px}.pband.target .ph .tg{color:var(--blue)}
.pgoal{flex-basis:100%;font-size:11.5px;color:var(--text-muted);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.pbody{padding:16px 22px 14px;display:flex;flex-direction:column;gap:26px;align-items:center}
.prow{display:flex;gap:18px;justify-content:center;position:relative;z-index:2}
.pdefer{border:1px dashed rgba(163,113,247,.6);border-radius:4px;padding:10px 14px;color:var(--text-secondary);font-size:12px;max-width:460px;background:rgba(163,113,247,.06);position:relative;z-index:2;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.pdefer b{color:var(--purple);font-family:var(--mono)}
.pdefer ul{margin:6px 0 0 16px;color:var(--text-muted);font-size:11.5px}
.card.gate.human{border-color:rgba(88,166,255,.7);background:linear-gradient(180deg,rgba(88,166,255,.09),var(--bg-secondary))}
.card.gate.human .top .k{color:var(--blue)}
.card.waiting{border-color:var(--blue);animation:hrpulse 1.6s ease-in-out infinite}
@keyframes hrpulse{50%{box-shadow:0 0 0 4px rgba(88,166,255,.28)}}
.card.waiting .pill{color:#fff;background:var(--blue);border-color:var(--blue)}
.tag.planned{background:rgba(163,113,247,.2);color:var(--purple)}
.sel-sec .m.human{color:var(--blue);border-color:rgba(88,166,255,.5)}
/* 人間レビュー */
.badge.waitb{color:#fff;background:var(--blue);border-color:var(--blue)}
.hr-panel{border:1px solid var(--blue);background:#0f1b2b;border-radius:8px;padding:10px 14px;margin:-4px 0 12px;box-shadow:0 4px 18px rgba(0,0,0,.45)}
.hr-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:13px}
.hr-head b{color:var(--blue);font-family:var(--mono);letter-spacing:.06em}
.hr-stop{font-size:11.5px;color:var(--blue)}
.hr-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;margin-top:8px}
.hr-h{font-size:10.5px;letter-spacing:.1em;color:var(--text-muted);font-family:var(--mono);text-transform:uppercase;margin-bottom:4px}
.hr-chk{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:2px 0}.hr-chk input{width:auto}
.hr-act{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.hr-act textarea{min-height:52px;font-size:12.5px;background:var(--bg-primary)}
.hr-btns{display:flex;gap:8px}
.gbar.wait{background:repeating-linear-gradient(45deg,var(--blue) 0 4px,rgba(88,166,255,.35) 4px 8px)}
.hr-log .tl{padding:3px 0}
.k.plan{color:var(--purple)}.k.human{color:var(--blue)}.k.human-ok{color:var(--blue)}.k.human-ng{color:var(--red)}
@media (max-width:800px){.hr-grid{grid-template-columns:minmax(0,1fr)}}

/* 詳細パネル（人向けの要点を上に、AI 向けの情報は折りたたみ） */
.sel-sec{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}
.sel-sec .dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sel-sec .dk{font-size:11px;font-weight:600;color:var(--text-secondary);border:1px solid var(--border);border-radius:3px;padding:0 7px}
.sel-sec .dk.gate{color:var(--yellow);border-color:rgba(210,153,34,.5)}
.sel-sec .dk.human{color:var(--blue);border-color:rgba(88,166,255,.6)}
.sel-sec .dk.phase{color:var(--purple);border-color:rgba(163,113,247,.5)}
.sel-sec .dh .x{margin-left:auto;cursor:pointer;color:var(--text-muted);border:0;background:none;font-size:15px}
.sel-sec .dh .x:hover{color:var(--text-primary)}
.sel-sec .dt{font-size:16px;font-weight:600;line-height:1.4;margin:2px 0 8px}
.sel-sec .dwhat{font-size:13.5px;line-height:1.65;color:var(--text-primary)}
.sel-sec .ds{margin-top:12px}
.sel-sec .dl{font-size:11.5px;color:var(--text-muted);margin-bottom:4px;font-weight:600}
.sel-sec .ddod{list-style:none}
.sel-sec .ddod li{font-size:13px;line-height:1.55;padding:3px 0 3px 20px;position:relative}
.sel-sec .ddod li::before{content:"✓";position:absolute;left:2px;color:var(--green);font-weight:700}
.sel-sec .dchk{list-style:none}
.sel-sec .dchk li{display:flex;gap:8px;align-items:baseline;font-size:13px;line-height:1.55;padding:4px 0;border-bottom:1px solid rgba(48,54,61,.6)}
.sel-sec .dchk li:last-child{border-bottom:0}
.sel-sec .dchk .ic{flex:none;width:18px;text-align:center}
.sel-sec .dchk .tx{flex:1}
.sel-sec .dchk .who{flex:none;font-size:10.5px;color:var(--text-muted);border:1px solid var(--border);border-radius:3px;padding:0 5px}
.sel-sec .dchk li.human .tx{color:var(--text-primary);font-weight:600}
.sel-sec .dchk li.human .who{color:var(--blue);border-color:rgba(88,166,255,.5)}
.sel-sec .dflow{margin-top:10px;font-size:12px;line-height:1.6;color:var(--text-secondary);background:var(--bg-secondary);border-radius:4px;padding:6px 9px}
.sel-sec .dflow.human{color:#a5d0ff;background:rgba(88,166,255,.09)}
.sel-sec .dsteps{margin:0 0 0 18px;font-size:13px;line-height:1.7}
.sel-sec .dsteps li{cursor:pointer}.sel-sec .dsteps li:hover{color:var(--blue)}
.sel-sec .ddefer{font-size:12.5px;line-height:1.6;color:#cdb6ff;border:1px dashed rgba(163,113,247,.5);border-radius:4px;padding:6px 9px}
.sel-sec .ddefer ul{margin:4px 0 0 16px;color:var(--text-secondary);font-size:12px}
.sel-sec .dmeta{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:11.5px;color:var(--text-muted)}
.sel-sec .dmore{margin-top:12px;border-top:1px solid var(--border);padding-top:8px}
.sel-sec .dmore summary{cursor:pointer;font-size:11px;color:var(--text-muted);list-style:none}
.sel-sec .dmore summary::-webkit-details-marker{display:none}
.sel-sec .dmore summary::before{content:"▸ ";font-family:var(--mono)}
.sel-sec .dmore[open] summary::before{content:"▾ "}
.sel-sec .dmore .kv2{margin-top:6px}
.sel-sec .dmore dd.mono{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--text-secondary)}
.dlive{font-size:12.5px;padding:6px 9px;border-radius:4px;margin-bottom:12px;background:var(--bg-secondary);display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.dlive.running b{color:var(--blue)}.dlive.done b{color:var(--green)}.dlive.waiting b{color:var(--blue)}
.dlive .fail{flex-basis:100%;color:var(--red);font-size:12px}
.kv2 dt.jp{text-transform:none;letter-spacing:0;font-size:11.5px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Hiragino Sans',sans-serif}

/* レビュー画面（全面） */
.rv-ov{position:fixed;inset:0;z-index:80;background:var(--bg-primary);display:flex;flex-direction:column}
.rv-top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--blue);background:#0f1b2b;font-size:13px}
.rv-top b{color:var(--blue);font-family:var(--mono);letter-spacing:.06em}
.rv-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.rv-doc{width:100%;height:100%;border:0;background:#0d1117}
.rv-side{border-left:1px solid var(--border);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:8px;background:var(--bg-secondary)}
.rv-h{font-size:11.5px;color:var(--text-muted);font-weight:600;margin-top:8px}
.rv-side textarea{min-height:120px;font-size:13px;line-height:1.6}
.rv-btns{display:flex;gap:8px;flex-wrap:wrap}
.rv-past{font-size:12.5px;color:var(--text-secondary)}.rv-past b.ng{color:var(--red)}
@media (max-width:800px){.rv-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}.rv-side{border-left:0;border-top:1px solid var(--border);max-height:45vh}}
/* 完了: 結果のサマリ */
.res-hero{display:flex;gap:16px;align-items:center;margin:8px 0 14px}
.res-hero .ok{width:44px;height:44px;border-radius:50%;background:rgba(63,185,80,.15);color:var(--green);display:grid;place-items:center;font-size:22px;flex:none}
.res-k{font-size:11.5px;color:var(--green);font-family:var(--mono);letter-spacing:.04em}
.res-hero h2{font-size:20px;line-height:1.5;font-weight:600}
.res-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:6px 20px 18px}
.res-h{font-size:12px;color:var(--text-muted);font-weight:600;margin:16px 0 6px}
.caps{list-style:none}
.caps li{font-size:14.5px;line-height:1.6;padding:4px 0 4px 24px;position:relative}
.caps li::before{content:"✓";position:absolute;left:4px;color:var(--green);font-weight:700}
.tryit{font-family:var(--mono);font-size:12px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;padding:10px 12px;white-space:pre-wrap;color:var(--text-secondary)}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2px 18px;font-size:12px}
.flist div{display:flex;gap:8px;align-items:baseline}.flist code{flex:1;font-family:var(--mono);color:var(--text-secondary)}
.flist .a,.res-h .a{color:var(--green);font-family:var(--mono)}.flist .d,.res-h .d,.dec .d{color:var(--red)}
.dec{font-size:13.5px;line-height:1.7}
.res-warn{margin-top:14px;border:1px solid var(--border);border-radius:10px;padding:4px 20px 14px}
.res-warn.hot{border-color:rgba(248,81,73,.6);background:rgba(248,81,73,.05)}
.res-warn.hot>.res-h{color:var(--red)}
.irr-item2{font-size:13px;padding:6px 0;border-bottom:1px solid var(--border)}
.note-row{font-size:12.5px;color:var(--text-secondary);margin-top:8px}.note-row b{color:var(--text-primary);font-weight:600}
.proc{margin-top:22px;border-top:1px solid var(--border);padding-top:10px}
.proc>summary{cursor:pointer;font-size:14px;font-weight:600;list-style:none;padding:6px 0}
.proc>summary::-webkit-details-marker{display:none}
.proc>summary::before{content:"▸ ";color:var(--text-muted);font-family:var(--mono)}
.proc[open]>summary::before{content:"▾ "}

/* 修正フェーズ（入れ子） */
.pband.fixband{align-self:stretch;border-style:dashed;border-color:rgba(255,166,87,.6);border-left:3px solid #ffa657;background:rgba(255,166,87,.04);z-index:2}
.pband.fixband>.ph{background:#1f1a14}
.pmode.fix{color:#ffa657;border-color:rgba(255,166,87,.6)}
.tag.fix{background:rgba(255,166,87,.2);color:#ffa657}
.tag.triage{background:rgba(163,113,247,.2);color:var(--purple)}
.card.mk-fix{border-color:rgba(255,166,87,.7)}
.k.rework{color:#ffa657}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ============================================================
// モックデータ（AI なし。計画はキーワードで切り替えるテンプレート）
// ============================================================
const ROLES = {
  orchestrator:{provider:'claude',model:'claude-fable-5-1',color:'#a371f7',label:'オーケストレーター'},
  design:{provider:'claude',model:'opus',color:'#58a6ff',label:'設計'},
  'code-review':{provider:'claude',model:'opus',color:'#f778ba',label:'コードレビュー'},
  'text-review':{provider:'claude',model:'opus',color:'#db61a2',label:'文章レビュー'},
  'text-writer':{provider:'claude',model:'sonnet',color:'#56d4dd',label:'テキストライター'},
  'impl-code':{provider:'cursor',model:'grok-4.6-high-fast',color:'#3fb950',label:'実装'},
  'impl-test':{provider:'cursor',model:'grok-4.6-high-fast',color:'#7ee787',label:'テスト実装'},
  research:{provider:'cursor',model:'grok-4.7-medium-fast',color:'#d29922',label:'調査'},
  'quick-task':{provider:'cursor',model:'composer-2.5-fast',color:'#ffa657',label:'クイック作業'},
};
const LANE_COLORS = ['#58a6ff','#3fb950','#7ee787','#56d4dd','#a371f7','#f778ba'];
const EXAMPLES = [
  '既存の REST API に JWT 認証（ログイン / リフレッシュ / 認可ミドルウェア）を追加して。仕様書・テスト・README も更新すること。',
  'README.md を英語に翻訳して README.en.md を作って。用語は docs/glossary.md と揃えること。',
  'ダッシュボードの履歴画面に、職種・ステータスで絞り込めるフィルタを付けて。',
];

// 計画はフェーズ（大まかな段階）を上から順に進める。内部ではフェーズを lanes / s.lane と呼ぶ
// mode: 'fixed' = 手順を計画時に確定 / 'deferred' = フェーズ開始直前に Orchestrator が手順を計画
const step = (o) => Object.assign({kind:'work',deps:[],dod:[],desc:'',scope:'',mark:null}, o);
const gate = (o) => Object.assign({kind:'gate',deps:[],checks:[],desc:'',mark:null,role:'code-review'}, o);
const ph = (o) => Object.assign({mode:'fixed', goal:'', notes:[], mark:null}, o);
const finalPhase = () => ph({id:'PF', name:'完了確認', final:true, goal:'完了条件を全体で確認する'});
const human = (text) => ({text, method:'human'});

function planAuth() {
  return {
    kind:'auth', title:'認証機能（JWT）の追加', goal:'既存 API に JWT 認証を追加し、仕様・テスト・ドキュメントまで揃える',
    spec:{scope:['src/auth/**','tests/auth/**','docs/spec.md','README.md'],constraints:['既存エンドポイントの互換性を壊さない','依存ライブラリは最小限','TDD（テストを先に書く）'],completion:['npm test と npm run build が成功する','認証 API が仕様書どおりに動く','README に使い方（curl 例）がある'],assumptions:['トークンは HS256 署名','リフレッシュトークンの保存先は DB ではなくステートレス']},
    lanes:[
      ph({id:'P1',name:'アーキテクチャを決める',goal:'認証方式・API 仕様・エラー設計を決め、仕様書に反映する'}),
      ph({id:'P2',name:'実装を行う',goal:'決めた設計どおりに認証ミドルウェアと API を実装する'}),
      ph({id:'P3',name:'テストを実装する',mode:'deferred',goal:'実装に対する単体・結合テストを揃える',notes:['実装の分割結果を見て、単体 / 結合テストの分け方を決める']}),
      ph({id:'P4',name:'ドキュメントを更新する',goal:'README と用語集を実装に合わせる'}),
      finalPhase()],
    facts:{given:['REST API は Express 製','TypeScript strict / TDD が必須'],toInvestigate:['既存ミドルウェアの構成','利用可能な JWT ライブラリ'],toDerive:['認可ルールの表','エラーレスポンス仕様'],assumptions:['トークン保存はクライアント側','署名は HS256']},
    steps:[
      step({id:'s1',lane:'P1',role:'research',title:'既存構成と JWT ライブラリの調査',desc:'既存ミドルウェア・ルーティング構成と、候補ライブラリを調査して報告する。',dod:['既存ミドルウェアの一覧と適用順が報告されている','ライブラリ候補 2 件以上の比較表がある'],scope:'（読み取りのみ）'}),
      step({id:'s2',lane:'P1',role:'design',title:'認証アーキテクチャと API 仕様の設計',deps:['s1'],desc:'トークン方式・保存先、ログイン / リフレッシュ API とエラー仕様を設計し、仕様書に反映する。',dod:['docs/spec.md に認証 API 仕様が追記されている','401 / 403 の区別と認可ルールが表で定義されている'],scope:'docs/spec.md'}),
      gate({id:'g1',lane:'P1',role:'code-review',title:'アーキテクチャレビュー',desc:'AI の事前チェックの後、人間がアーキテクチャをレビューする。承認されるまで実装に進まない。',checks:[{text:'仕様書が既存の記述と矛盾していない',method:'agent-review'},human('トークン方式・保存先の方針に合意できる'),human('API 仕様とエラー設計に合意できる')]}),
      step({id:'s3',lane:'P2',role:'impl-code',title:'認証ミドルウェアの実装',desc:'JWT 検証ミドルウェアと認可ガードを実装する。',dod:['トークン検証・期限切れ・署名不正を判別できる','401 / 403 を仕様どおり返す'],scope:'src/auth/middleware.ts'}),
      step({id:'s4',lane:'P2',role:'impl-code',title:'ログイン / リフレッシュ API の実装',deps:['s3'],desc:'ログインとトークン更新のエンドポイントを実装する。',dod:['/auth/login と /auth/refresh が仕様どおりに応答する','既存エンドポイントの挙動が変わらない'],scope:'src/auth/routes.ts'}),
      gate({id:'g2',lane:'P2',role:'code-review',title:'実装ゲート',desc:'ビルドとコードレビュー。',checks:[{text:'npm run build が成功する',method:'command',command:'npm run build'},{text:'仕様書と実装が一致している',method:'agent-review'}]}),
      gate({id:'g3',lane:'P3',role:'code-review',title:'テストゲート',desc:'全テストを実行して確認。',checks:[{text:'npm test が全件成功する',method:'command',command:'docker compose run --rm app npm test'},{text:'カバレッジが既存水準を下回らない',method:'command',command:'npm run coverage'}]}),
      step({id:'s7',lane:'P4',role:'text-writer',title:'README・API ドキュメントの更新',desc:'認証 API の使い方を README に追記する。',dod:['README に認証の使い方と curl 例がある','docs/glossary.md の用語と整合している'],scope:'README.md'}),
      gate({id:'g4',lane:'P4',role:'text-review',title:'文章ゲート',desc:'文章レビューと textlint。',checks:[{text:'textlint が指摘 0 件',method:'command',command:'npx textlint README.md'},{text:'用語集と表記が揃っている',method:'agent-review'}]}),
      gate({id:'gF',lane:'PF',role:'code-review',title:'最終ゲート',desc:'完了条件を全体で確認する。',checks:[{text:'全フェーズのゲートが合格している',method:'agent-review'},{text:'スコープ外のファイルが変更されていない',method:'command',command:'git diff --stat'},{text:'完了条件（計画の「完了条件」）を満たしている',method:'agent-review'}]}),
    ]};
}
function planText() {
  return {
    kind:'text', title:'README の英語化', goal:'README.md を英訳し、用語集と整合した README.en.md を作る',
    spec:{scope:['README.md（読み取り）','README.en.md'],constraints:['コードは変更しない','コードブロックは翻訳しない'],completion:['README.en.md が README.md と同じ見出し構成','用語が docs/glossary.md と一致している'],assumptions:['英語は米国式の表記']},
    lanes:[
      ph({id:'P1',name:'用語を整理する',goal:'README に出る用語の訳語を決める'}),
      ph({id:'P2',name:'翻訳する',mode:'deferred',goal:'README.en.md を書き上げる',notes:['訳語表と原文の分量を見て、分割数を決める']}),
      finalPhase()],
    facts:{given:['対象は README.md','用語集 docs/glossary.md がある'],toInvestigate:['用語集の英訳が定義済みか'],toDerive:['訳語対応表'],assumptions:['コードブロックは翻訳しない']},
    steps:[
      step({id:'s1',lane:'P1',role:'research',title:'用語集から訳語対応表を作る',desc:'README に出る用語を抽出し、glossary の英訳と対応付ける。',dod:['README の主要用語 100% に訳語が対応している'],scope:'（読み取りのみ）'}),
      gate({id:'g1',lane:'P1',role:'text-review',title:'訳語レビュー',desc:'訳語表を人が確認してから翻訳に入る。',checks:[{text:'訳語に揺れがない',method:'agent-review'},human('訳語表に合意できる')]}),
      gate({id:'g2',lane:'P2',role:'text-review',title:'翻訳ゲート',checks:[{text:'意味の欠落・追加がない',method:'agent-review'},{text:'textlint が指摘 0 件',method:'command',command:'npx textlint README.en.md'}]}),
      gate({id:'gF',lane:'PF',role:'text-review',title:'最終ゲート',checks:[{text:'README.md と README.en.md の構成が一致している',method:'agent-review'},{text:'完了条件（計画の「完了条件」）を満たしている',method:'agent-review'}]}),
    ]};
}
function planGeneric(title) {
  return {
    kind:'generic', title, goal:title,
    spec:{scope:['src/dashboard/public/**','tests/dashboard/**'],constraints:['既存 UI のスタイルに合わせる','新しい依存を追加しない'],completion:['フィルタ操作で一覧が絞り込まれる','npm test と npm run build が成功する'],assumptions:['フィルタ対象は職種とステータスの 2 軸']},
    lanes:[
      ph({id:'P1',name:'方針を決める',goal:'現状を調べ、変更方針と UI 仕様を決める'}),
      ph({id:'P2',name:'実装を行う',goal:'方針どおりに実装する'}),
      ph({id:'P3',name:'テストを実装する',mode:'deferred',goal:'変更に対するテストを揃える',notes:['実装で触ったファイルを見て、テストの単位を決める']}),
      finalPhase()],
    facts:{given:['（指示から抽出）'],toInvestigate:['対象画面の現状実装'],toDerive:['フィルタ条件の仕様'],assumptions:['既存 UI の部品を再利用する']},
    steps:[
      step({id:'s1',lane:'P1',role:'research',title:'現状の実装と影響範囲の調査',desc:'対象箇所と影響範囲を調査する。',dod:['変更対象ファイルの一覧が報告されている'],scope:'（読み取りのみ）'}),
      step({id:'s2',lane:'P1',role:'design',title:'変更方針の設計',deps:['s1'],desc:'変更方針と UI 仕様をまとめる。',dod:['変更方針が箇条書きで示されている'],scope:'docs/'}),
      gate({id:'g1',lane:'P1',role:'code-review',title:'方針レビュー',desc:'実装に入る前に人が方針を確認する。',checks:[{text:'方針が要件を満たしている',method:'agent-review'},human('変更方針に合意できる')]}),
      step({id:'s3',lane:'P2',role:'impl-code',title:'変更の実装',desc:'方針に沿って実装する。',dod:['要件どおりに動作する','既存の挙動を壊していない'],scope:'src/**'}),
      gate({id:'g2',lane:'P2',role:'code-review',title:'実装ゲート',checks:[{text:'ビルドが成功する',method:'command',command:'npm run build'},{text:'コードレビューで重大指摘がない',method:'agent-review'}]}),
      gate({id:'g3',lane:'P3',role:'code-review',title:'テストゲート',checks:[{text:'全テストが成功する',method:'command',command:'docker compose run --rm app npm test'},{text:'テストが要件を網羅している',method:'agent-review'}]}),
      gate({id:'gF',lane:'PF',role:'code-review',title:'最終ゲート',checks:[{text:'全フェーズのゲートが合格している',method:'agent-review'},{text:'完了条件（計画の「完了条件」）を満たしている',method:'agent-review'}]}),
    ]};
}

// ============================================================
// 状態
// ============================================================
const S = {
  phase:'instruct', form:{instruction:'', workspace:''}, plan:null, revs:[], thread:[],
  drawer:null, addText:'', targets:[], replanning:false, planningIdx:0, tab:'log', speed:1, failScenario:'earlier', demoReplan:true, demoIrregular:true, reviewText:'',
};
let R = null, timer = null;

// ============================================================
// 計画ユーティリティ
// ============================================================
const byId = (id) => S.plan.steps.find(s => s.id === id);
const phaseById = (id) => S.plan.lanes.find(l => l.id === id);
const laneSteps = (lid) => S.plan.steps.filter(s => s.lane === lid);
const laneGate = (lid) => S.plan.steps.find(s => s.lane === lid && s.kind === 'gate');
const workOf = (lid) => laneSteps(lid).filter(s => s.kind === 'work');
const laneColor = (lid) => LANE_COLORS[Math.max(0, S.plan.lanes.findIndex(l => l.id === lid)) % LANE_COLORS.length];
const finalLane = () => S.plan.lanes.find(l => l.final);
const isFinal = (s) => { const p = phaseById(s.lane); return !!p && !!p.final; };
const isHuman = (g) => g.kind === 'gate' && g.checks.some(c => c.method === 'human');
/** 指示の対象（手順・ゲート・フェーズ）を共通の形で返す */
const targetOf = (id) => { const s = byId(id); if (s) return {id, title:s.title, kind:s.kind}; const p = phaseById(id); return p ? {id, title:p.name, kind:'phase'} : null; };

/** 直前のフェーズの出口ゲート（入れ子の修正フェーズは数えない） */
function prevGate(pid) {
  const L = S.plan.lanes, i = L.findIndex(l => l.id === pid);
  for (let k = i - 1; k >= 0; k--) { if (L[k].parent) continue; const g = laneGate(L[k].id); if (g) return g; }
  return null;
}
/** ゲート不合格から追加された、入れ子の修正フェーズ */
const fixLanes = (pid) => S.plan.lanes.filter(l => l.parent === pid);
/** フェーズ内で他の手順から依存されていない手順（出口ゲートの対象） */
function sinks(pid) { const ws = workOf(pid); return ws.filter(w => !ws.some(x => x.deps.includes(w.id))); }
// 実効依存: フェーズ内の依存がない手順は、前フェーズのゲート合格後に始まる。ゲートはフェーズの末端手順の後
function effDeps(s) {
  const p = phaseById(s.lane);
  if (s.kind === 'gate') {
    // 修正フェーズがあれば、その完了後に同じゲートを再チェックする
    const fx = fixLanes(s.lane).flatMap(l => { const fg = laneGate(l.id); return fg ? [fg.id] : sinks(l.id).map(x => x.id); });
    // 修正フェーズの起点（原因の切り分け）は修正フェーズ経由でつながるので、直接は待たない
    const via = new Set(fixLanes(s.lane).map(l => l.after));
    const all = sinks(s.lane).map(x => x.id).filter(id => !via.has(id)).concat(fx); if (all.length) return all;
    if (p && p.after) return [p.after];
    const g = prevGate(s.lane); return g ? [g.id] : [];
  }
  const inPhase = s.deps.filter(d => { const x = byId(d); return x && x.lane === s.lane; });
  if (inPhase.length) return inPhase;
  if (p && p.after) return [p.after];
  const g = prevGate(s.lane); return g ? [g.id] : [];
}
function levels() {
  const memo = {}, stack = new Set(); let cyc = false;
  const lv = (s) => {
    if (memo[s.id] != null) return memo[s.id];
    if (stack.has(s.id)) { cyc = true; return 0; }
    stack.add(s.id);
    const v = effDeps(s).reduce((m, d) => Math.max(m, byId(d) ? lv(byId(d)) + 1 : 0), 0);
    stack.delete(s.id); return (memo[s.id] = v);
  };
  S.plan.steps.forEach(lv);
  return {memo, cyc};
}
function validate() {
  const P = S.plan, out = [], phs = P.lanes.filter(l => !l.final && !l.parent);
  const fin = P.steps.find(s => isFinal(s) && s.kind === 'gate');
  out.push(fin ? {lv:'ok',text:'V1 最終ゲート（完了確認）がある'} : {lv:'error',text:'V1 最終ゲート（完了確認）がない',fix:{label:'再生成',fn:fixFinal}});
  const missing = phs.filter(l => !laneGate(l.id));
  out.push(missing.length === 0
    ? {lv:'ok',text:`V2 全 ${phs.length} フェーズが出口ゲートで終わる`}
    : {lv:'error',text:`V2 出口ゲートがないフェーズ: ${missing.map(l => l.name).join('、')}`,fix:{label:'自動挿入',fn:() => missing.forEach(l => ensureGate(l.id))}});
  const noDod = P.steps.filter(s => s.kind === 'work' && !s.dod.some(x => x.trim()));
  out.push(noDod.length === 0 ? {lv:'ok',text:'V3 全手順に完了定義（DoD）がある'} : {lv:'error',text:`V3 DoD が未設定: ${noDod.map(s => s.id + ' ' + s.title).join('、')}`});
  const empty = phs.filter(l => l.mode === 'fixed' && workOf(l.id).length === 0), noGoal = phs.filter(l => l.mode === 'deferred' && !l.goal.trim());
  const nDef = phs.filter(l => l.mode === 'deferred').length;
  out.push(empty.length + noGoal.length === 0
    ? {lv:'ok',text:`V4 確定フェーズに手順があり、未決定フェーズ ${nDef} 件にも目的がある`}
    : {lv:'error',text:`V4 ${empty.length ? '手順のない確定フェーズ: ' + empty.map(l => l.name).join('、') : ''}${noGoal.length ? ' 目的のない未決定フェーズ: ' + noGoal.map(l => l.name).join('、') : ''}`,
       fix:empty.length ? {label:'未決定にする',fn:() => empty.forEach(l => { l.mode = 'deferred'; })} : undefined});
  const noChk = P.steps.filter(s => s.kind === 'gate' && !s.checks.some(c => c.text.trim()));
  out.push(noChk.length === 0 ? {lv:'ok',text:'V5 全ゲートにチェック項目がある'} : {lv:'error',text:`V5 チェック未設定のゲート: ${noChk.map(s => s.id).join('、')}`});
  const badRole = P.steps.filter(s => !ROLES[s.role]);
  out.push(badRole.length === 0 ? {lv:'ok',text:'V6 全職種がヘルスチェック通過済み'} : {lv:'error',text:'V6 未定義の職種がある'});
  out.push(levels().cyc ? {lv:'error',text:'V7 依存に循環がある'} : {lv:'ok',text:'V7 依存に循環がない'});
  const L = levels().memo, conflicts = [];

function render() {
  const root = document.getElementById('root'), keep = {};
  root.querySelectorAll('[data-keep]').forEach(el => keep[el.dataset.keep] = [el.scrollLeft, el.scrollTop]);
  const sy = window.scrollY, ae = document.activeElement, aeId = ae && ae.tagName === 'TEXTAREA' && ae.closest('.actionbar') ? 'bar' : null;
  let view;
  switch (S.phase) {
    case 'instruct': view = InstructView(); break;
    case 'planning': view = PlanningView(); break;
    case 'review': view = ReviewView(); break;
    case 'run': view = RunView(); break;
    case 'done': view = DoneView(); break;
  }
  root.replaceChildren(...[Header(), h('div', {class:'page'}, view), S.phase !== 'instruct' && S.phase !== 'planning' ? Drawer() : null,
    S.replanning ? h('div', {class:'overlay'}, h('div', {class:'card-box', style:'text-align:center'}, h('div', {class:'spin', style:'width:22px;height:22px'}), h('div', {style:'margin-top:10px'}, 'Planner が計画を更新しています…'))) : null].filter(Boolean));
  root.querySelectorAll('[data-keep]').forEach(el => { const k = keep[el.dataset.keep]; if (k) { el.scrollLeft = k[0]; el.scrollTop = k[1]; } });
  window.scrollTo(0, sy);
  if (aeId) { const ta = root.querySelector('.actionbar textarea'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }
  requestAnimationFrame(() => root.querySelectorAll('.board').forEach(drawEdges));
}
window.addEventListener('resize', () => document.querySelectorAll('.board').forEach(drawEdges));
render();
</script>
</body>
</html>
